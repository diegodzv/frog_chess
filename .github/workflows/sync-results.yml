name: Sync chess.com results

on:
  schedule:
    - cron: '0 * * * *' # every hour; sync-results.mjs exits fast when there's nothing to do
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to dispatch deploy-pages.yml

concurrency:
  group: tournament-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "frog-chess-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Remember current commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync results from chess.com
        working-directory: scripts
        run: node sync-results.mjs

      # Pushes made with the workflow's GITHUB_TOKEN don't trigger other workflows, so the site has to be
      # redeployed explicitly whenever this run committed new data.
      - name: Redeploy the site if the bot committed
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.head.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            gh workflow run deploy-pages.yml --ref "${{ github.event.repository.default_branch || 'main' }}"
          fi
