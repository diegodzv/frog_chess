name: Sync chess.com results

on:
  schedule:
    - cron: '0 * * * *' # every hour; sync-results.mjs exits fast when there's nothing to do
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tournament-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "frog-chess-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Sync results from chess.com
        working-directory: scripts
        run: node sync-results.mjs
