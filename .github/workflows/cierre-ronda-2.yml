name: Cierre de la ronda 2

# One-off form to close round 2 from the phone: one dropdown per game still unplayed on Sunday night (mesa 11 and
# mesa 15 on the site), and optionally open round 3 in the same run. Syncs chess.com first; a game synced from
# chess.com keeps its real result even if a manual one is chosen here (IF_PENDING). Refuses to run unless the
# tournament is still in round 2, so it can never close a later round by mistake. Delete it once round 3 is open.

on:
  workflow_dispatch:
    inputs:
      mesa_11:
        description: 'Mesa 11: Tania Durán - José Luis Gómez Antón'
        required: true
        type: choice
        default: 'Jugada en chess.com'
        options:
          - 'Jugada en chess.com'
          - 'Gana Tania Durán'
          - 'Gana José Luis Gómez Antón'
          - 'No se jugó: pierden los dos'
      mesa_15:
        description: 'Mesa 15: Erik Nogués - David Prats'
        required: true
        type: choice
        default: 'Jugada en chess.com'
        options:
          - 'Jugada en chess.com'
          - 'Gana Erik Nogués'
          - 'Gana David Prats'
          - 'No se jugó: pierden los dos'
      abrir_ronda_3:
        description: 'Después, cerrar la ronda 2 y abrir la ronda 3'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write # to dispatch deploy-pages.yml

concurrency:
  group: tournament-data
  cancel-in-progress: false

jobs:
  close-round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "frog-chess-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Remember current commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check that round 2 is the current round
        run: |
          round=$(node -p "require('./data/tournament.json').currentRound")
          if [ "$round" != "2" ]; then
            echo "::error::El torneo está en la ronda $round, no en la 2: este formulario ya no sirve."
            exit 1
          fi

      - name: Sync results from chess.com first
        working-directory: scripts
        run: node sync-results.mjs

      - name: Enter the results chosen
        working-directory: scripts
        env:
          MESA_11: ${{ inputs.mesa_11 }}
          MESA_15: ${{ inputs.mesa_15 }}
        run: |
          set -e
          result() { ACTION=manual-result IF_PENDING=true RESULT="$1" PLAYER_A="$2" PLAYER_B="$3" REASON="$4" node advance-tournament.mjs; }
          case "$MESA_11" in
            'Gana Tania Durán') result gana-jugador-1 eskimogrrrl77 ToteBoss 'partida no jugada' ;;
            'Gana José Luis Gómez Antón') result gana-jugador-1 ToteBoss eskimogrrrl77 'partida no jugada' ;;
            'No se jugó: pierden los dos') result pierden-los-dos eskimogrrrl77 ToteBoss 'partida no jugada' ;;
            *) echo "Mesa 11: se deja el resultado de chess.com." ;;
          esac
          case "$MESA_15" in
            'Gana Erik Nogués') result gana-jugador-1 E-Kasiparov Devittot 'partida no jugada' ;;
            'Gana David Prats') result gana-jugador-1 Devittot E-Kasiparov 'partida no jugada' ;;
            'No se jugó: pierden los dos') result pierden-los-dos E-Kasiparov Devittot 'partida no jugada' ;;
            *) echo "Mesa 15: se deja el resultado de chess.com." ;;
          esac

      # next-round refuses, changing nothing, if a game is still without a result.
      - name: Close round 2 and open round 3
        if: inputs.abrir_ronda_3
        working-directory: scripts
        env:
          ACTION: next-round
        run: node advance-tournament.mjs

      # Pushes made with the workflow's GITHUB_TOKEN don't trigger other workflows, so the site has to be
      # redeployed explicitly whenever this run committed new data.
      - name: Redeploy the site if the bot committed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ steps.head.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            gh workflow run deploy-pages.yml --ref "${{ github.event.repository.default_branch || 'main' }}"
          fi
